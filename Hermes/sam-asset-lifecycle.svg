<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- ServiceNow SAM Asset Lifecycle Infographic -->
  <!-- Author: Hermes Agent | Date: 2026-11-04 -->

  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>

  <!-- Title Bar -->
  <rect x="40" y="40" width="1120" height="70" rx="10" fill="#0066cc"/>
  <text x="60" y="82" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white">ServiceNow SAM — Asset Lifecycle</text>
  <text x="60" y="104" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0">From Request to Retirement — Every Asset Tracked</text>

  <!-- Lifecycle Flow (center, left-to-right) -->
  <g transform="translate(40, 160)">
    
    <!-- Phase boxes -->
    <g id="phase-request">
      <rect x="40" y="200" width="160" height="140" rx="8" fill="#e3f2fd" stroke="#0066cc" stroke-width="2"/>
      <text x="120" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="middle">1. Request</text>
      <text x="120" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Employee needs</text>
      <text x="120" y="278" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">a laptop</text>
      <text x="120" y="296" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Table: alm_asset</text>
      <rect x="120" y="315" width="80" height="24" rx="4" fill="#0066cc"/>
      <text x="160" y="332" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Create PO</text>
    </g>

    <!-- Arrow 1 -->
    <line x1="200" y1="270" x2="240" y2="270" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>

    <g id="phase-procure">
      <rect x="240" y="200" width="160" height="140" rx="8" fill="#e3f2fd" stroke="#0066cc" stroke-width="2"/>
      <text x="320" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="middle">2. Procure</text>
      <text x="320" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Purchase order</text>
      <text x="320" y="278" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">sent to vendor</text>
      <text x="320" y="296" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Table: alm_vendor</text>
      <rect x="320" y="315" width="80" height="24" rx="4" fill="#0066cc"/>
      <text x="360" y="332" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Receive</text>
    </g>

    <!-- Arrow 2 -->
    <line x1="400" y1="270" x2="440" y2="270" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>

    <g id="phase-receive">
      <rect x="440" y="200" width="160" height="140" rx="8" fill="#e3f2fd" stroke="#0066cc" stroke-width="2"/>
      <text x="520" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="middle">3. Receive</text>
      <text x="520" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Asset arrives,</text>
      <text x="520" y="278" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">asset tag applied</text>
      <text x="520" y="296" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Table: alm_hardware</text>
      <rect x="520" y="315" width="80" height="24" rx="4" fill="#0066cc"/>
      <text x="560" y="332" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Deploy</text>
    </g>

    <!-- Arrow 3 -->
    <line x1="600" y1="270" x2="640" y2="270" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>

    <g id="phase-deploy">
      <rect x="640" y="200" width="160" height="140" rx="8" fill="#e3f2fd" stroke="#0066cc" stroke-width="2"/>
      <text x="720" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="middle">4. Deploy</text>
      <text x="720" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Assigned to</text>
      <text x="720" y="278" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">employee</text>
      <text x="720" y="296" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Table: alm_asset</text>
      <rect x="720" y="315" width="80" height="24" rx="4" fill="#0066cc"/>
      <text x="760" y="332" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Maintain</text>
    </g>

    <!-- Arrow 4 -->
    <line x1="800" y1="270" x2="840" y2="270" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>

    <g id="phase-maintain">
      <rect x="840" y="200" width="160" height="140" rx="8" fill="#e3f2fd" stroke="#0066cc" stroke-width="2"/>
      <text x="920" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="middle">5. Maintain</text>
      <text x="920" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Repairs,</text>
      <text x="920" y="278" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">warranty tracking</text>
      <text x="920" y="296" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Table: alm_contract</text>
      <rect x="920" y="315" width="80" height="24" rx="4" fill="#0066cc"/>
      <text x="960" y="332" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Retire</text>
    </g>

    <!-- Arrow 5 -->
    <line x1="1000" y1="270" x2="1040" y2="270" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>

    <g id="phase-retire">
      <rect x="1040" y="200" width="160" height="140" rx="8" fill="#e3f2fd" stroke="#0066cc" stroke-width="2"/>
      <text x="1120" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0066cc" text-anchor="middle">6. Retire</text>
      <text x="1120" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">Asset disposed,</text>
      <text x="1120" y="278" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">record updated</text>
      <text x="1120" y="296" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">State = Retired</text>
    </g>
  </g>

  <!-- Critical/Mandatory/Optional Panel (bottom left) -->
  <rect x="40" y="400" width="540" height="340" rx="10" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0066cc">Field Classification</text>
  
  <!-- Critical -->
  <rect x="60" y="450" width="160" height="30" rx="4" fill="#ff0000" opacity="0.15" stroke="#ff0000"/>
  <text x="75" y="472" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ff0000">■ CRITICAL</text>
  <text x="75" y="490" font-family="Arial, sans-serif" font-size="12" fill="#333">Number, Category,</text>
  <text x="75" y="506" font-family="Arial, sans-serif" font-size="12" fill="#333">State, Asset Tag</text>
  <text x="75" y="524" font-family="Arial, sans-serif" font-size="11" fill="#666">System won't work without</text>

  <!-- Mandatory -->
  <rect x="240" y="450" width="160" height="30" rx="4" fill="#ff9900" opacity="0.15" stroke="#ff9900"/>
  <text x="255" y="472" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ff9900">■ MANDATORY</text>
  <text x="255" y="490" font-family="Arial, sans-serif" font-size="12" fill="#333">Name, Purchase</text>
  <text x="255" y="506" font-family="Arial, sans-serif" font-size="12" fill="#333">Date, Assigned To,</text>
  <text x="255" y="522" font-family="Arial, sans-serif" font-size="11" fill="#333">Vendor</text>
  <text x="255" y="540" font-family="Arial, sans-serif" font-size="11" fill="#666">Required for daily work</text>

  <!-- Optional -->
  <rect x="420" y="450" width="160" height="30" rx="4" fill="#ffcc00" opacity="0.15" stroke="#ffcc00"/>
  <text x="435" y="472" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffcc00">■ OPTIONAL</text>
  <text x="435" y="490" font-family="Arial, sans-serif" font-size="12" fill="#333">Cost, Location,</text>
  <text x="435" y="506" font-family="Arial, sans-serif" font-size="12" fill="#333">Pool, Serial Number</text>
  <text x="435" y="524" font-family="Arial, sans-serif" font-size="11" fill="#666">Nice to have</text>

  <!-- Key Tables Panel (bottom right) -->
  <rect x="600" y="400" width="560" height="340" rx="10" fill="#ffffff" stroke="#0066cc" stroke-width="2"/>
  <text x="620" y="430" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0066cc">Core SAM Tables</text>
  
  <text x="620" y="458" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">alm_asset</text>
  <text x="620" y="474" font-family="Arial, sans-serif" font-size="11" fill="#666">Core asset record</text>
  
  <text x="620" y="496" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">alm_vendor</text>
  <text x="620" y="512" font-family="Arial, sans-serif" font-size="11" fill="#666">Suppliers / vendors</text>
  
  <text x="620" y="534" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">alm_contract</text>
  <text x="620" y="550" font-family="Arial, sans-serif" font-size="11" fill="#666">Warranties &amp; support</text>
  
  <text x="620" y="572" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">alm_hardware</text>
  <text x="620" y="588" font-family="Arial, sans-serif" font-size="11" fill="#666">Serial, MAC, warranty</text>
  
  <text x="620" y="610" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">alm_software</text>
  <text x="620" y="626" font-family="Arial, sans-serif" font-size="11" fill="#666">Licenses &amp; installs</text>

  <!-- Footer -->
  <rect x="40" y="750" width="1120" height="30" rx="5" fill="#e3f2fd"/>
  <text x="60" y="770" font-family="Arial, sans-serif" font-size="12" fill="#0066cc">Hermes Agent | ServiceNow_Learning_SAM | 2026-11-04</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0066cc"/>
    </marker>
  </defs>
</svg>
