<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- ServiceNow SAM Field Classification Infographic -->
  <!-- Author: Hermes Agent | Date: 2026-11-04 -->

  <!-- Background -->
  <rect width="1200" height="800" fill="#f8fafc"/>

  <!-- Title Bar -->
  <rect x="40" y="40" width="1120" height="70" rx="10" fill="#0066cc"/>
  <text x="60" y="82" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white">ServiceNow SAM — Field Classification</text>
  <text x="60" y="104" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0">Critical vs. Mandatory vs. Optional — Know What Matters</text>

  <!-- Three Columns -->
  
  <!-- CRITICAL Column -->
  <rect x="40" y="160" width="340" height="540" rx="10" fill="#ffffff" stroke="#ff0000" stroke-width="3"/>
  <rect x="40" y="160" width="340" height="60" rx="8" fill="#ff0000"/>
  <text x="210" y="200" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">CRITICAL</text>
  <text x="210" y="222" font-family="Arial, sans-serif" font-size="12" fill="#ffe0e0" text-anchor="middle">System won't work without</text>
  
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Fields:</text>
  
  <g>
    <!-- Number -->
    <rect x="60" y="275" width="280" height="50" rx="6" fill="#ffe0e0" stroke="#ff0000"/>
    <text x="75" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff0000">Number</text>
    <text x="75" y="318" font-family="Arial, sans-serif" font-size="12" fill="#333">Auto-generated unique ID</text>
    
    <!-- Category -->
    <rect x="60" y="340" width="280" height="50" rx="6" fill="#ffe0e0" stroke="#ff0000"/>
    <text x="75" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff0000">Category</text>
    <text x="75" y="383" font-family="Arial, sans-serif" font-size="12" fill="#333">Drives form layout</text>
    
    <!-- State -->
    <rect x="60" y="405" width="280" height="50" rx="6" fill="#ffe0e0" stroke="#ff0000"/>
    <text x="75" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff0000">State</text>
    <text x="75" y="448" font-family="Arial, sans-serif" font-size="12" fill="#333">Tracks lifecycle position</text>
    
    <!-- Asset Tag -->
    <rect x="60" y="470" width="280" height="50" rx="6" fill="#ffe0e0" stroke="#ff0000"/>
    <text x="75" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff0000">Asset Tag</text>
    <text x="75" y="513" font-family="Arial, sans-serif" font-size="12" fill="#333">Physical identification</text>
  </g>

  <!-- MANDATORY Column -->
  <rect x="400" y="160" width="400" height="540" rx="10" fill="#ffffff" stroke="#ff9900" stroke-width="3"/>
  <rect x="400" y="160" width="400" height="60" rx="8" fill="#ff9900"/>
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">MANDATORY</text>
  <text x="600" y="222" font-family="Arial, sans-serif" font-size="12" fill="#fff0d9" text-anchor="middle">Required for daily work</text>
  
  <text x="420" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Fields:</text>
  
  <g>
    <!-- Name -->
    <rect x="420" y="275" width="320" height="50" rx="6" fill="#fff0d9" stroke="#ff9900"/>
    <text x="435" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9900">Name</text>
    <text x="435" y="318" font-family="Arial, sans-serif" font-size="12" fill="#333">Identifies the asset</text>
    
    <!-- Purchase Date -->
    <rect x="420" y="340" width="320" height="50" rx="6" fill="#fff0d9" stroke="#ff9900"/>
    <text x="435" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9900">Purchase Date</text>
    <text x="435" y="383" font-family="Arial, sans-serif" font-size="12" fill="#333">Warranty &amp; depreciation</text>
    
    <!-- Assigned To -->
    <rect x="420" y="405" width="320" height="50" rx="6" fill="#fff0d9" stroke="#ff9900"/>
    <text x="435" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9900">Assigned To</text>
    <text x="435" y="448" font-family="Arial, sans-serif" font-size="12" fill="#333">Accountability — who has it</text>
    
    <!-- Vendor -->
    <rect x="420" y="470" width="320" height="50" rx="6" fill="#fff0d9" stroke="#ff9900"/>
    <text x="435" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9900">Vendor</text>
    <text x="435" y="513" font-family="Arial, sans-serif" font-size="12" fill="#333">Support contact</text>
  </g>

  <!-- OPTIONAL Column -->
  <rect x="820" y="160" width="340" height="540" rx="10" fill="#ffffff" stroke="#ffcc00" stroke-width="3"/>
  <rect x="820" y="160" width="340" height="60" rx="8" fill="#ffcc00"/>
  <text x="990" y="200" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">OPTIONAL</text>
  <text x="990" y="222" font-family="Arial, sans-serif" font-size="12" fill="#fff2b0" text-anchor="middle">Nice to have</text>
  
  <text x="840" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Fields:</text>
  
  <g>
    <!-- Cost -->
    <rect x="840" y="275" width="280" height="50" rx="6" fill="#fff2b0" stroke="#ffcc00"/>
    <text x="855" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffcc00">Cost</text>
    <text x="855" y="318" font-family="Arial, sans-serif" font-size="12" fill="#333">Budget tracking</text>
    
    <!-- Location -->
    <rect x="840" y="340" width="280" height="50" rx="6" fill="#fff2b0" stroke="#ffcc00"/>
    <text x="855" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffcc00">Location</text>
    <text x="855" y="383" font-family="Arial, sans-serif" font-size="12" fill="#333">Physical whereabouts</text>
    
    <!-- Pool -->
    <rect x="840" y="405" width="280" height="50" rx="6" fill="#fff2b0" stroke="#ffcc00"/>
    <text x="855" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffcc00">Pool</text>
    <text x="855" y="448" font-family="Arial, sans-serif" font-size="12" fill="#333">Group similar assets</text>
    
    <!-- Serial Number -->
    <rect x="840" y="470" width="280" height="50" rx="6" fill="#fff2b0" stroke="#ffcc00"/>
    <text x="855" y="495" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffcc00">Serial Number</text>
    <text x="855" y="513" font-family="Arial, sans-serif" font-size="12" fill="#333">Warranty &amp; support</text>
  </g>

  <!-- Bottom Panel: Common Mistakes -->
  <rect x="40" y="720" width="1120" height="60" rx="8" fill="#fff5f5" stroke="#ff4444" stroke-width="2"/>
  <text x="60" y="745" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff4444">⚠ Common Mistake:</text>
  <text x="300" y="745" font-family="Arial, sans-serif" font-size="13" fill="#333">Missing asset tag → Can't identify the physical asset. Always tag on receipt.</text>
  <text x="60" y="764" font-family="Arial, sans-serif" font-size="13" fill="#333">⚠ Wrong category → Wrong fields appear on form. Choose category before saving.</text>

  <!-- Footer -->
  <rect x="40" y="770" width="1120" height="20" rx="5" fill="#e3f2fd"/>
  <text x="60" y="785" font-family="Arial, sans-serif" font-size="11" fill="#0066cc">Hermes Agent | ServiceNow_Learning_SAM | 2026-11-04</text>
</svg>
