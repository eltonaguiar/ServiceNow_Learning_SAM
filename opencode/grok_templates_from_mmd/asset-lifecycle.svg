<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <style>
      .box { fill: #e1f5fe; stroke: #01579b; stroke-width: 2; rx: 8; }
      .decision { fill: #fff9c4; stroke: #f57f17; stroke-width: 2; }
      .end { fill: #ffcdd2; stroke: #c62828; stroke-width: 2; rx: 8; }
      text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  <rect class="box" x="200" y="20" width="200" height="40" />
  <text x="300" y="45">Request Asset</text>
  <line class="arrow" x1="300" y1="60" x2="300" y2="90" />
  <rect class="box" x="200" y="90" width="200" height="40" />
  <text x="300" y="115">Procure/Order</text>
  <line class="arrow" x1="300" y1="130" x2="300" y2="160" />
  <rect class="box" x="200" y="160" width="200" height="40" />
  <text x="300" y="185">Receive</text>
  <line class="arrow" x1="300" y1="200" x2="300" y2="230" />
  <rect class="box" x="200" y="230" width="200" height="40" />
  <text x="300" y="255">Setup &amp; Tag</text>
  <line class="arrow" x1="300" y1="270" x2="300" y2="300" />
  <rect class="box" x="200" y="300" width="200" height="40" />
  <text x="300" y="325">Assign to Employee</text>
  <line class="arrow" x1="300" y1="340" x2="300" y2="370" />
  <rect class="box" x="200" y="370" width="200" height="40" />
  <text x="300" y="395">Use &amp; Maintain</text>
  <line class="arrow" x1="300" y1="410" x2="300" y2="450" />
  <polygon class="decision" points="300,450 360,490 300,530 240,490" />
  <text x="300" y="495">Needs Repair?</text>
  <line class="arrow" x1="240" y1="490" x2="120" y2="490" />
  <text x="180" y="480">Yes</text>
  <rect class="box" x="20" y="470" width="100" height="40" />
  <text x="70" y="495">In Repair</text>
  <line class="arrow" x1="70" y1="510" x2="70" y2="560" />
  <line class="arrow" x1="70" y1="560" x2="300" y2="560" />
  <line class="arrow" x1="300" y1="560" x2="300" y2="530" />
  <text x="185" y="550">Return to Service</text>
  <line class="arrow" x1="360" y1="490" x2="480" y2="490" />
  <text x="420" y="480">No</text>
  <polygon class="decision" points="480,450 540,490 480,530 420,490" />
  <text x="480" y="495">Replace?</text>
  <line class="arrow" x1="480" y1="530" x2="480" y2="580" />
  <text x="500" y="555">Yes</text>
  <rect class="box" x="400" y="580" width="160" height="40" />
  <text x="480" y="605">Retire</text>
  <line class="arrow" x1="480" y1="620" x2="480" y2="660" />
  <rect class="end" x="400" y="660" width="160" height="40" />
  <text x="480" y="685">Dispose/Recycle</text>
  <line class="arrow" x1="420" y1="490" x2="300" y2="320" />
  <text x="360" y="400">No</text>
</svg>
