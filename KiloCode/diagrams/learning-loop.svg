<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <style>
      .text { font-family: Arial, sans-serif; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1565c0; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .box { stroke: #333; stroke-width: 2; }
      .small { font-size: 12px; }
    </style>
  </defs>

  <text x="400" y="40" class="title" text-anchor="middle">ServiceNow SAM 5-Step Learning Loop</h1>
  <text x="400" y="65" class="subtitle" text-anchor="middle">Learn Any ServiceNow Module in Under 2 Hours</text>

  <!-- Step 1 -->
  <rect x="50" y="120" width="140" height="90" rx="10" fill="#e3f2fd" class="box" />
  <text x="120" y="145" class="text" text-anchor="middle">1. ORIENT</text>
  <text x="120" y="165" class="text small" text-anchor="middle">Find module, table, role</text>
  <text x="120" y="180" class="text small" text-anchor="middle">Write 1-sentence summary</text>

  <!-- Step 2 -->
  <rect x="250" y="120" width="140" height="90" rx="10" fill="#e3f2fd" class="box" />
  <text x="320" y="145" class="text" text-anchor="middle">2. CONFIGURE</text>
  <text x="320" y="165" class="text small" text-anchor="middle">Activate module, grant</text>
  <text x="320" y="180" class="text small" text-anchor="middle">role, create test record</text>

  <!-- Step 3 -->
  <rect x="450" y="120" width="140" height="90" rx="10" fill="#e3f2fd" class="box" />
  <text x="520" y="145" class="text" text-anchor="middle">3. BUILD</text>
  <text x="520" y="165" class="text small" text-anchor="middle">Complete lab exercise</text>
  <text x="520" y="180" class="text small" text-anchor="middle">Create working artifact</text>

  <!-- Step 4 -->
  <rect x="50" y="250" width="140" height="90" rx="10" fill="#e3f2fd" class="box" />
  <text x="120" y="275" class="text" text-anchor="middle">4. VERIFY</text>
  <text x="120" y="295" class="text small" text-anchor="middle">Check list view, logs,</text>
  <text x="120" y="310" class="text small" text-anchor="middle">related lists, permissions</text>

  <!-- Step 5 -->
  <rect x="250" y="250" width="140" height="90" rx="10" fill="#e3f2fd" class="box" />
  <text x="320" y="275" class="text" text-anchor="middle">5. TEACH BACK</text>
  <text x="320" y="295" class="text small" text-anchor="middle">Explain in 2 minutes</text>
  <text x="320" y="310" class="text small" text-anchor="middle">Identify what's next</text>

  <!-- Arrows -->
  <line x1="190" y="165" x2="250" y="165" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="390" y="165" x2="450" y="165" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="120" y="210" x2="120" y="250" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="320" y="340" x2="120" y="340" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="0" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#1565c0" />
    </marker>
  </defs>

  <text x="400" y="460" class="text" text-anchor="middle">ServiceNow SAM Rapid Learning Loop - Generated by Kilo</text>
</svg>
