<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffebee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcdd2;stop-opacity:1" />
    </linearGradient>
    <style>
      .text { font-family: Arial, sans-serif; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1565c0; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .box { stroke: #333; stroke-width: 2; }
      .small { font-size: 12px; }
    </style>
  </defs>

  <text x="400" y="40" class="title" text-anchor="middle">ServiceNow SAM License Compliance Flow</text>
  <text x="400" y="65" class="subtitle" text-anchor="middle">From License Creation to Compliance Resolution</text>

  <!-- Step 1: Create License -->
  <rect x="50" y="100" width="140" height="70" rx="8" fill="#e3f2fd" class="box" />
  <text x="120" y="120" class="text" text-anchor="middle">1. Create</text>
  <text x="120" y="138" class="text small" text-anchor="middle">Software License</text>
  <text x="120" y="153" class="text small" text-anchor="middle">Record</text>

  <!-- Step 2: Allocate -->
  <rect x="250" y="100" width="140" height="70" rx="10" fill="#e3f2fd" class="box" />
  <text x="320" y="120" class="text" text-anchor="middle">2. Allocate</text>
  <text x="320" y="138" class="text small" text-anchor="middle">License to</text>
  <text x="320" y="153" class="text small" text-anchor="middle">Device/User</text>

  <!-- Step 3: Track -->
  <rect x="450" y="100" width="140" height="70" rx="10" fill="#e3f2fd" class="box" />
  <text x="520" y="120" class="text" text-anchor="middle">3. Track</text>
  <text x="520" y="138" class="text small" text-anchor="middle">Actual Usage</text>
  <text x="520" y="153" class="text small" text-anchor="middle">vs Entitlement</text>

  <!-- Decision -->
  <rect x="50" y="220" width="140" height="80" rx="10" fill="#fff3e0" class="box" />
  <text x="120" y="240" class="text" text-anchor="middle">4. Compliance</text>
  <text x="120" y="258" class="text" text-anchor="middle">Check?</text>
  <text x="120" y="273" class="text small" text-anchor="middle">Used vs Entitled</text>

  <!-- Compliant -->
  <rect x="50" y="340" width="140" height="70" rx="10" fill="#c8e6c9" class="box" />
  <text x="120" y="360" class="text" text-anchor="middle">5. COMPLIANT</text>
  <text x="120" y="378" class="text small" text-anchor="middle">Green - OK</text>

  <!-- Under-licensed -->
  <rect x="250" y="340" width="140" height="70" rx="10" fill="#ffcdd2" class="box" />
  <text x="320" y="360" class="text" text-anchor="middle">6. UNDER-LICENSED</text>
  <text x="320" y="378" class="text small" text-anchor="middle">Red - Buy More</text>

  <!-- Over-licensed -->
  <rect x="450" y="340" width="140" height="70" rx="10" fill="#fff9c4" class="box" />
  <text x="520" y="360" class="text" text-anchor="middle">7. OVER-LICENSED</text>
  <text x="520" y="378" class="text small" text-anchor="middle">Yellow - Reclaim</text>

  <!-- Arrows -->
  <line x1="190" y="135" x2="250" y="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y="135" x2="450" y="135" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="120" y="180" x2="120" y="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="120" y="300" x2="320" y="320" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="120" y="300" x2="520" y="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="400" y="580" class="text" text-anchor="middle">ServiceNow SAM License Compliance Flow - Generated by Kilo</text>
</svg>
