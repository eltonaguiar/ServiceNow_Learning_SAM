<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <style>
      .text { font-family: Arial, sans-serif; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #1565c0; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #333; }
      .box { stroke: #333; stroke-width: 2; }
      .small { font-size: 12px; }
    </style>
  </defs>

  <text x="400" y="30" class="title" text-anchor="middle">ServiceNow SAM Module Relationships</text>
  <text x="400" y="55" class="subtitle" text-anchor="middle">How SAM Modules Connect &amp; Flow Data</text>

  <!-- Core -->
  <rect x="330" y="80" width="140" height="60" rx="8" fill="#e8f5e9" class="box" />
  <text x="400" y="100" class="text" text-anchor="middle">SAM Core</text>
  <text x="400" y="118" class="text small" text-anchor="middle">Central Platform</text>

  <!-- SAM Modules -->
  <rect x="50" y="180" width="120" height="70" rx="8" fill="#e3f2fd" class="box" />
  <text x="110" y="200" class="text" text-anchor="middle">Software Asset</text>
  <text x="110" y="215" class="text small" text-anchor="middle">Management</text>

  <rect x="280" y="180" width="120" height="70" rx="8" fill="#e3f2fd" class="box" />
  <text x="340" y="200" class="text" text-anchor="middle">Hardware Asset</text>
  <text x="340" y="215" class="text small" text-anchor="middle">Management</text>

  <rect x="530" y="180" width="120" height="70" rx="8" fill="#e3f2fd" class="box" />
  <text x="590" y="200" class="text" text-anchor="middle">Procurement</text>
  <text x="590" y="215" class="text small" text-anchor="middle">Management</text>

  <rect x="50" y="280" width="120" height="70" rx="8" fill="#e3f2fd" class="box" />
  <text x="110" y="300" class="text" text-anchor="middle">Contract</text>
  <text x="110" y="315" class="text small" text-anchor="middle">Management</text>

  <rect x="250" y="280" width="140" height="70" rx="8" fill="#e3f2fd" class="box" />
  <text x="320" y="300" class="text" text-anchor="middle">License Management</text>
  <text x="320" y="315" class="text small" text-anchor="middle"></text>

  <rect x="420" y="280" width="140" height="70" rx="8" fill="#e3f2fd" class="box" />
  <text x="490" y="300" class="text" text-anchor="middle">Platform Analytics</text>
  <text x="490" y="315" class="text small" text-anchor="middle">Reporting</text>

  <!-- Connections -->
  <line x1="360" y="140" x2="110" y="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y="140" x2="340" y="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y="140" x2="590" y="180" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y="250" x2="110" y="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y="310" x2="320" y="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y="210" x2="320" y="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <text x="400" y="460" class="text" text-anchor="middle">ServiceNow SAM Module Relationships - Generated by Kilo</text>
</svg>
