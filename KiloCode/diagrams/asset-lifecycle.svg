<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ce93d8;stop-opacity:1" />
    </linearGradient>
    <style>
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1565c0; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .box { stroke: #333; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="40" class="title" text-anchor="middle">ServiceNow SAM Asset Lifecycle</text>
  <text x="400" y="60" class="subtitle" text-anchor="middle">From Request to Retirement</text>

  <!-- Step 1: Request -->
  <rect x="50" y="100" width="140" height="80" rx="10" fill="#e8f5e9" class="box" />
  <text x="120" y="125" class="text" text-anchor="middle">1. REQUEST</text>
  <text x="120" y="145" class="text" text-anchor="middle">User submits</text>
  <text x="120" y="160" class="text" text-anchor="middle">asset request</text>

  <!-- Step 2: Procure -->
  <rect x="250" y="100" width="140" height="80" rx="10" fill="#e8f5e9" class="box" />
  <text x="320" y="125" class="text" text-anchor="middle">2. PROCURE</text>
  <text x="320" y="145" class="text" text-anchor="middle">Purchase from</text>
  <text x="320" y="160" class="text" text-anchor="middle">approved vendor</text>

  <!-- Step 3: Receive -->
  <rect x="450" y="100" width="140" height="80" rx="10" fill="#e8f5e9" class="box" />
  <text x="520" y="125" class="text" text-anchor="middle">3. RECEIVE</text>
  <text x="520" y="145" class="text" text-anchor="middle">Asset arrives,</text>
  <text x="520" y="160" class="text" text-anchor="middle">tagged &amp; logged</text>

  <!-- Step 4: Deploy -->
  <rect x="50" y="220" width="140" height="80" rx="10" fill="#e8f5e9" class="box" />
  <text x="120" y="245" class="text" text-anchor="middle">4. DEPLOY</text>
  <text x="120" y="265" class="text" text-anchor="middle">Assign to user</text>
  <text x="120" y="280" class="text" text-anchor="middle">or department</text>

  <!-- Step 5: Maintain -->
  <rect x="250" y="220" width="140" height="80" rx="10" fill="#e8f5e9" class="box" />
  <text x="320" y="245" class="text" text-anchor="middle">5. MAINTAIN</text>
  <text x="320" y="265" class="text" text-anchor="middle">Updates, patches,</text>
  <text x="320" y="280" class="text" text-anchor="middle">repairs, audits</text>

  <!-- Step 6: Retire -->
  <rect x="450" y="220" width="140" height="80" rx="10" fill="#ffebee" class="box" />
  <text x="520" y="245" class="text" text-anchor="middle">6. RETIRE</text>
  <text x="520" y="265" class="text" text-anchor="middle">Decommission,</text>
  <text x="520" y="280" class="text" text-anchor="middle">dispose or recycle</text>

  <!-- Arrows -->
  <line x1="190" y="140" x2="250" y="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y="140" x2="450" y="140" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="120" y="180" x2="120" y="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y="180" x2="320" y="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="520" y="180" x2="520" y="220" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="120" y="300" x2="320" y="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Arrows definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Footer -->
  <text x="400" y="580" class="text" text-anchor="middle">ServiceNow SAM Asset Lifecycle - Generated by Kilo</text>
</svg>
