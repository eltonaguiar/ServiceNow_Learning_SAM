<rect width="1180" height="500" fill="#0b1120"/>
<text x="40" y="52" font-size="26" fill="#e5ecf7" font-weight="700" text-anchor="start">SAM build order — Crawl, Walk, Run</text>
<text x="40" y="80" font-size="13.5" fill="#94a3b8" font-weight="400" text-anchor="start">Nine steps, each with the checkpoint that says you may continue.</text>
